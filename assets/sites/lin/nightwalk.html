<p><b>林的备忘录</b><br/><a href="/">文章</a> / <a href="/about">关于</a></p><hr/><h1>从北站走回家，花了52分钟</h1><p class="meta">2026-10-20 · 生活</p><p>没赶上车。看地图只有三公里多，觉得能走，就走了。结果出站口选错，多绕了快一公里。</p><h2>给下次的自己</h2><ul><li>北站走东出口，西边那条路晚上还在施工。</li><li>沿河走到第二座桥再过，第一座桥下的路不通。</li><li>便利店零点关门，别指望路上买水。</li></ul><p>经过河岸街书店的时候居然亮着灯。里面在搬书，门口写着下午两点营业。明天有空去看一下。</p><p>到家一点多，洗完澡反而不困了。耳机没电，全程听路边风扇和车。<br/>下次还是提前五分钟出门吧，这步数没必要挣。</p><hr/><p><a href="/">所有文章</a></p>
