<h1>西园站B出口上行扶梯检修安排</h1>
<p class="meta">发布日期：2026-10-19 16:00 · 发布部门：车站服务部</p>
<p>因计划检修，环线西园站B出口上行扶梯将于2026年10月20日至10月27日暂停使用。B出口楼梯、下行扶梯保持开放。</p>
<p>携带大件行李或需要无障碍通行的乘客，可使用A出口电梯。检修不影响列车停靠及车站其他出入口开放安排。</p>
<p>恢复时间如有调整，将在本站公告及西园站出入口告示中更新。感谢理解与配合。</p>
<p>环城轨道交通车站服务部<br/>2026年10月19日</p>
